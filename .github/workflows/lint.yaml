name: lint & check generated

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Check generated files are up to date
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vendor dependencies
        run: go mod vendor

      - name: Regenerate deepcopy
        run: make generate

      # CRD manifest regeneration skipped on release-2.14: controller-gen v0.5.0
      # cannot resolve newer k8s types. CRD is regenerated locally with a newer
      # controller-gen and committed manually.

      - name: Check for uncommitted changes
        run: git diff --exit-code
